services:
  db:
    image: postgres:15
    container_name: graphvis-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graphvis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: ./backend
    container_name: graphvis-backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=graphvis
      - NETWORKX_API_URL=http://networkx-api:8001
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - KEEP_ALIVE_TIMEOUT=${KEEP_ALIVE_TIMEOUT}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--timeout-keep-alive", "${KEEP_ALIVE_TIMEOUT}"]
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - ./backend:/app

  networkx-api:
    build: ./networkx-api
    container_name: graphvis-networkx-api
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=graphvis
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - ./networkx-api:/app

  frontend:
    build: ./frontend
    container_name: graphvis-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
