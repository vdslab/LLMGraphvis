services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./API/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=graphvis
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build:
      context: ./API
      cache_from:
        - ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    volumes:
      - ./API:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # These are now managed in the .env file
      # - DATABASE_URL=postgresql://postgres:postgres@db:5432/networkvis
      # - SECRET_KEY=your-secret-key
      # - ALGORITHM=HS256
      # - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - NETWORKX_MCP_URL=http://networkx-mcp:8001 # This can stay as it's internal to docker-compose
    env_file:
      - ./.env

  networkx-mcp:
    build:
      context: ./NetworkXMCP
      cache_from:
        - ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    volumes:
      - ./NetworkXMCP:/app
    ports:
      - "8001:8001"
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment:
      - LOG_LEVEL=DEBUG

  frontend:
    build:
      context: ./frontend
      target: development # Explicitly target development stage
      cache_from:
        - node:20-alpine
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - api
      - networkx-mcp

volumes:
  postgres_data:
