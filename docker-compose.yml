# Cap container log size so long-running services can't fill the host disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15
    container_name: graphvis-db
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-graphvis}
    # Loopback-only: the DB must not be reachable from other machines.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: graphvis-backend
    logging: *default-logging
    # Set DISABLE_CONTAINER_IPV6=1 in .env on networks where the container's
    # IPv6 egress is broken at the TLS layer (TCP connects but the handshake
    # hangs): httpx/anyio's happy-eyeballs races TCP only, so it picks the
    # broken IPv6 socket and every LLM API call times out. Mutually exclusive
    # with PREFER_IPV6_GAI_CONF (NAT64/DNS64 networks need IPv6).
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=${DISABLE_CONTAINER_IPV6:-0}
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-graphvis}
      - NETWORKX_API_URL=http://networkx-api:8001
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-google}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      # Region fallback chain (ANTHROPIC_VERTEX_REGION -> VERTEX_LOCATION -> code default)
      # is resolved in the provider code; no default here so .env stays authoritative.
      - ANTHROPIC_VERTEX_REGION=${ANTHROPIC_VERTEX_REGION:-}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-}
      - KEEP_ALIVE_TIMEOUT=${KEEP_ALIVE_TIMEOUT:-86400}
      - VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive ${KEEP_ALIVE_TIMEOUT:-86400}"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - ./backend:/app
      - ./common:/app/common
      # Falls back to /dev/null when GOOGLE_APPLICATION_CREDENTIALS is unset
      # (API-key auth) so the mount spec stays valid and compose can start.
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/app/application_default_credentials.json
      # Egress address-family preference. Default (/dev/null = empty gai.conf)
      # is standard glibc behavior, which works on normal IPv4/dual-stack
      # networks. On IPv6-only (NAT64/DNS64) networks — where Docker Desktop's
      # IPv4 relay breaks HTTPS — set PREFER_IPV6_GAI_CONF=./backend/gai.conf
      # in .env to prefer IPv6, then recreate the stack (docker compose down && up).
      - ${PREFER_IPV6_GAI_CONF:-/dev/null}:/etc/gai.conf

  networkx-api:
    build:
      context: .
      dockerfile: networkx-api/Dockerfile
    container_name: graphvis-networkx-api
    logging: *default-logging
    # Loopback-only: this service has no authentication of its own — every
    # authorization check lives in the backend, so exposing it beyond the
    # host would let anyone read/modify any network by ID.
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-graphvis}
      - LOG_LEVEL=${LOG_LEVEL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - ./networkx-api:/app
      - ./common:/app/common

  frontend:
    build: ./frontend
    container_name: graphvis-frontend
    logging: *default-logging
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
