[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black. Google's guide says 80, but the codebase was written to 88.
line-length = 88

[tool.ruff.lint]
# pycodestyle (E, W), Pyflakes (F), isort (I), and the formatting half of
# pydocstyle under the Google convention. Missing docstrings (D1xx) are not
# enforced: much existing code predates the convention.
select = ["E", "F", "I", "W", "D2", "D3", "D4"]
ignore = []

# Allow autofix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tool docstrings and Field descriptions are prompt surface, sent verbatim
# (indentation included): long lines are deliberate (AGENTS.md), and a
# docstring "fix" would change what the model reads.
"networkx-api/app/mcp/tools/**" = ["E501", "D"]
# Packages re-export their modules; MCP tool packages import for registration.
"__init__.py" = ["F401", "F403"]
# Import order is registration order, which is the order list_tools returns.
"networkx-api/app/mcp/tools/**/__init__.py" = ["I001"]
"networkx-api/app/mcp_server.py" = ["I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# Both services name their package `app`; `common` is shared between them.
known-first-party = ["app", "common"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true
