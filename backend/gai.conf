# Prefer IPv6 even when the container's source address is a ULA (fd00::/8),
# as on Docker Desktop dual-stack networks.
#
# Why: on IPv6-only (NAT64/DNS64) networks, Docker Desktop's transparent
# relay for outbound IPv4 HTTPS is broken (SSL: UNEXPECTED_EOF_WHILE_READING),
# while IPv6 egress works. glibc's default RFC 6724 label table gives ULA
# sources their own label (fc00::/7 -> 6), which mismatches global IPv6
# destinations (label 1), so rule 5 demotes IPv6 below IPv4 and every HTTPS
# call takes the broken IPv4 path.
#
# This is the default glibc label table minus the fc00::/7 entry, so ULA
# sources fall under ::/0 (label 1) and IPv6 destinations sort first again.
# On normal dual-stack/IPv4 networks this matches standard behavior.
label ::1/128       0
label ::/0          1
label 2002::/16     2
label ::/96         3
label ::ffff:0:0/96 4
label fec0::/10     5
label 2001:0::/32   7
