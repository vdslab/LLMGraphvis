name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies & linters
      run: |
        uv pip install ruff black mypy pytest pytest-cov
        # API dependencies
        cd API && uv pip install -e . && cd ..
        # NetworkXMCP dependencies
        cd NetworkXMCP && uv pip install -e . && cd ..
    
    - name: Lint with Ruff
      run: |
        ruff check API NetworkXMCP
    
    - name: Format with Black
      run: |
        black --check API NetworkXMCP
    
    - name: Type check with MyPy
      run: |
        mypy API NetworkXMCP
    
    - name: Test with pytest
      run: |
        pytest API/tests NetworkXMCP/tests --cov=API --cov=NetworkXMCP --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false